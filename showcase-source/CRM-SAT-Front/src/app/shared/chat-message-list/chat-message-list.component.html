<div *ngFor="let msg of messages"
     class="mb-4 group relative"
     [attr.data-sender]="msg.isSender">

  <div class="flex"
       [ngClass]="{ 'justify-end': msg.isSender, 'justify-start': !msg.isSender }">

    <div class="max-w-[78%] lg:max-w-[65%]">

      <!-- Nombre (solo receptor) -->
      <div *ngIf="msg.sender && !msg.isSender"
           class="text-xs font-medium text-gray-500 mb-1 ml-3">
        {{ msg.sender?.displayName || msg.sender?.name || 'Usuario' }}
      </div>

      <!-- Burbuja + botón en flex EXACTAMENTE como en tu versión original -->
      <div class="flex items-end gap-2"
           [ngClass]="{ 'flex-row-reverse': msg.isSender }">

        <!-- Burbuja redonda que te encantó -->
        <div class="relative px-4 py-3 rounded-3xl shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden backdrop-blur-sm"
          [ngClass]="{
            'bg-gradient-to-br from-[#CBE1D5] to-[#96D6D5] text-white rounded-br-2xl': msg.isSender,
            'bg-terciario border border-gray-100 text-gray-800 rounded-bl-2xl': !msg.isSender
          }"
        >

          <!-- Colitas -->
          <div *ngIf="!msg.isSender"
               class="absolute bottom-0 left-0 w-3 h-3 bg-terciario border-l border-b border-gray-100 transform rotate-45 -ml-1.5 -mb-1.5 rounded-sm"></div>
          <div *ngIf="msg.isSender"
               class="absolute bottom-0 right-0 w-3 h-3 bg-blue-600 transform rotate-45 -mr-1.5 -mb-1.5 rounded-sm"></div>

          <!-- Contenido -->
          <ng-container [ngSwitch]="msg.type">
            <div *ngSwitchCase="'text'" class="text-sm leading-relaxed whitespace-pre-wrap">
              {{ msg.content }}
            </div>

            <div *ngSwitchCase="'image'" class="rounded-2xl overflow-hidden shadow-inner">
              <img [src]="apiUrlImage + msg.resourceUrl"
                   [alt]="msg.content || 'Imagen'"
                   class="max-w-full rounded-2xl cursor-pointer hover:scale-[1.02] transition-transform duration-300"
                   loading="lazy"
                   (click)="clickImage(msg)">
              <p *ngIf="msg.content" class="text-xs opacity-80 mt-2 italic">
                {{ msg.content }}
              </p>
            </div>

            <div *ngSwitchCase="'video'" class="rounded-2xl overflow-hidden shadow-inner">
              <video controls preload="metadata" class="rounded-2xl max-w-full">
                <source [src]="msg.resourceUrl" type="video/mp4">
                Tu navegador no soporta video.
              </video>
              <p *ngIf="msg.content" class="text-xs opacity-80 mt-2 italic">
                {{ msg.content }}
              </p>
            </div>

            <div *ngSwitchCase="'file'" class="bg-terciario/10 backdrop-blur rounded-2xl p-3 border border-white/20">
              <a [href]="apiUrlImage + msg.resourceUrl" download
                 class="flex items-center gap-3 hover:bg-terciario/20 transition rounded-xl -m-3 p-3">
                <iconify-icon icon="mdi:file-document" width="32" class="text-white/80"></iconify-icon>
                <div>
                  <p class="font-medium text-sm">{{ msg.content || 'Archivo' }}</p>
                  <p class="text-xs opacity-70">Toca para descargar</p>
                </div>
              </a>
            </div>
          </ng-container>

          <!-- Hora + checks -->
          <div class="flex items-center justify-end gap-1.5 mt-2 text-xs opacity-70">
            <span>{{ msg.createdAt | date:"h:mm a":"":"es-PE" }}</span>
            <iconify-icon *ngIf="msg.isSender && !msg.isRead" icon="mdi:check" width="14"></iconify-icon>
            <iconify-icon *ngIf="msg.isSender && msg.isRead" icon="mdi:check-all" width="14" class="text-blue-200"></iconify-icon>
          </div>
        </div>

        <!-- BOTÓN EXACTAMENTE COMO EN TU CÓDIGO ORIGINAL -->
        <div class="h-full flex items-center">
          <button *ngIf="msg.isSender"
                  type="button"
                  class="opacity-0 group-hover:opacity-100 transition-all duration-200 z-10 hover:scale-110"
                  (click)="menu.toggle($event); selectedMessage = msg"
                  aria-label="Opciones del mensaje">
            <div class="w-8 h-8 bg-terciario rounded-full shadow-lg flex items-center justify-center border border-gray-200 hover:bg-gray-50">
              <iconify-icon icon="ci:more-vertical" width="16" class="text-gray-500"></iconify-icon>
            </div>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- MENÚ CONTEXTUAL (tu original) -->
<p-overlayPanel #menu [dismissable]="true" class="shadow-xl rounded-xl overflow-hidden">
  <div class="py-1 bg-terciario border border-gray-200">
    <button class="block w-full text-left px-4 py-3 hover:bg-red-50 hover:text-red-400 text-sm font-medium transition-colors flex items-center gap-2"
            (click)="eliminarMensaje(selectedMessage!)">
      <iconify-icon icon="mdi:delete-outline" widtha="18"></iconify-icon>
      Eliminar mensaje
    </button>
  </div>
</p-overlayPanel>

<!-- TU DIÁLOGO DE IMAGEN QUE NUNCA DEBÍ BORRAR -->
<p-dialog header="Imagen" [modal]="true" [(visible)]="visibleImage" [style]="{ width: '60rem' }" appendTo="body">
  <img [src]="urlImage" alt="Imagen adjunta" class="w-full h-full object-contain bg-black" loading="lazy" />
</p-dialog>
