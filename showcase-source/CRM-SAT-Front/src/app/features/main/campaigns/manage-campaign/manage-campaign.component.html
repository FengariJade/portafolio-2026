<div class="w-full flex justify-center">
  <div class="w-full px-3">
    <div class="flex flex-col gap-4">
      <!-- Encabezado -->
      <div class="bg-terciario shadow rounded-[30px] p-4">
        <div
          class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4"
        >
          <div class="w-full lg:w-auto">
            <h5 class="text-xl sm:text-2xl font-semibold mb-1 ml-2 text-accent">
              Campañas de Audio
            </h5>
            <div class="flex flex-col w-full gap-3 text-n-slate-11">
              <p
                class="mb-0 text-sm font-normal line-clamp-3 sm:line-clamp-5 lg:line-clamp-none max-w-3xl text-gray-600 ml-2"
              >
                Administra campañas de Audio
              </p>
            </div>
          </div>

          <!-- Contenedor para los dos botones -->
          <div
            class="flex flex-col sm:flex-row items-start sm:items-center gap-2 sm:gap-3 w-full lg:w-auto"
          >
            <button
              pButton
              type="button"
              (click)="refresh()"
              class="
                bg-cuaternario
                !text-black
                hover:bg-accent-7
                hover:!text-white
                !rounded-full
                transition-all
                duration-200
                flex
                items-center
                gap-2
                px-4
                py-2
              ">
              <iconify-icon
                icon="lucide:refresh-ccw"
                class="text-lg text-inherit"
              ></iconify-icon>

              <span class="font-medium">
                Refrescar
              </span>
            </button>


            <button
              pButton
              type="button"
              (click)="addNew()"
              class="
                bg-cuaternario
                !text-black
                hover:bg-accent-7
                hover:!text-white
                !rounded-full
                transition-all
                duration-200
                flex
                items-center
                gap-2
                px-4
                py-2
              ">
              <iconify-icon
                icon="mdi:plus-circle-outline"
                class="text-lg text-inherit"
              ></iconify-icon>

              <span class="font-medium">
                Nueva Campaña - Audio
              </span>
            </button>

            <button
              pButton
              type="button"
              (click)="addNewMultiple()"
              class="
                bg-cuaternario
                !text-black
                hover:bg-accent-7
                hover:!text-white
                !rounded-full
                transition-all
                duration-200
                flex
                items-center
                gap-2
                px-4
                py-2
              ">
              <iconify-icon
                icon="mdi:plus-circle-outline"
                class="text-lg text-inherit"
              ></iconify-icon>

              <span class="font-medium">
                Nueva Campaña Multiple - Audio
              </span>
            </button>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <section class="h-[calc(100vh-17rem)] overflow-y-auto rounded-[30px]">
        <complete-table
          [cols]="cols"
          [orderBy]="orderBy"
          [dataTable]="campaniaListFiltradas"
          [total]="total()"
          [limit]="limit()"
          [offset]="offset()"
          (actionClicked)="onTableAction($event)"
          (searchChange)="searchChange($event)"
        />
      </section>
