<div class="grid grid-cols-1 gap-6">
  <p-table
    [value]="permissions"
    sortMode="single"
    [scrollable]="true"
    scrollHeight="calc(100vh - 240px)"
    rowGroupMode="subheader"
    groupRowsBy="parentId"
    [tableStyle]="{ 'min-width': '60rem' }"
    styleClass="table-header-light"
  >
    <ng-template #header>
      <tr>
        <th rowspan="2">
          <div class="text-center text-xs uppercase">Módulo</div>
        </th>
        @for (role of roleList; track $index) {
        <th colspan="5">
          <div class="text-center text-xs uppercase">{{ role.name }}</div>
        </th>
        }
      </tr>
      <tr>
        @for (role of roleList; track $index) {
        <th class="w-28">
          <div class="text-center text-xs uppercase">Todos</div>
        </th>
        <th class="w-28">
          <div class="text-center text-xs uppercase">Leer</div>
        </th>
        <th class="w-28">
          <div class="text-center text-xs uppercase">Crear</div>
        </th>
        <th class="w-28">
          <div class="text-center text-xs uppercase">Editar</div>
        </th>
        <th class="w-28">
          <div class="text-center text-xs uppercase">Eliminar</div>
        </th>
        }
      </tr>
    </ng-template>
    <ng-template #groupheader let-item>
      @if(item.parent){
      <tr pRowGroupHeader>
        <td [colSpan]="1 + roleList.length * 5">
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold uppercase">
              {{ item.parent?.name }}
            </span>
          </div>
        </td>
      </tr>
      }
    </ng-template>
    <ng-template #body let-row let-rowIndex="rowIndex">
      <tr>
        <td>
          <span class="text-sm capitalize">{{ row.name }}</span>
        </td>
        @for (item of row.permissions; track $index) {
        <td>
          <div class="flex justify-center items-center gap-2">
            <p-checkbox
              [(ngModel)]="item.markAll"
              [binary]="true"
              (ngModelChange)="selectAll(item)"
            />
          </div>
        </td>
        <td>
          <div class="flex justify-center items-center gap-2">
            <p-checkbox
              [(ngModel)]="item.canRead"
              [binary]="true"
              (ngModelChange)="checkMarkRead($event, item)"
            />
          </div>
        </td>
        <td>
          <div class="flex justify-center items-center gap-2">
            <p-checkbox
              [(ngModel)]="item.canCreate"
              [binary]="true"
              (ngModelChange)="checkMarkAll(item)"
            />
          </div>
        </td>
        <td>
          <div class="flex justify-center items-center gap-2">
            <p-checkbox
              [(ngModel)]="item.canUpdate"
              [binary]="true"
              (ngModelChange)="checkMarkAll(item)"
            />
          </div>
        </td>
        <td>
          <div class="flex justify-center items-center gap-2">
            <p-checkbox
              [(ngModel)]="item.canDelete"
              [binary]="true"
              (ngModelChange)="checkMarkAll(item)"
            />
          </div>
        </td>
        }
      </tr>
    </ng-template>
  </p-table>
  <div class="flex justify-end gap-2">
    <button
        pButton
        type="button"
        (click)="onCancel()"
        class="
        bg-cuaternario
        !text-black
        hover:!bg-[red]
        hover:!border-[red]
        hover:!text-white
        !rounded-full
        transition-all
        duration-200
        flex
        items-center
        gap-2
        px-4
        py-2"
          >
            <span class="font-medium">
              Cancelar
            </span>
      </button>

      <button
        pButton
        type="button"
        [loading]="loading"
        (click)="onSubmit()"
        class="
        bg-cuaternario
        !text-black
        hover:bg-accent-7
        hover:!text-white
        !rounded-full
        transition-all
        duration-200
        flex
        items-center
        gap-2
        px-4
        py-2"
          >
            <iconify-icon
              icon="mdi:plus-circle-outline"
              class="text-lg text-inherit"
            ></iconify-icon>

            <span class="font-medium">
              Actualizar permisos
            </span>
      </button>
  </div>
</div>
