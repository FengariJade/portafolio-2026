  <h1 class="text-2xl font-semibold mb-2">Oops... Algo salió mal</h1>
  <p>No pudimos conectarnos con el servidor.</p>
  <p>Por favor, verifica tu conexión o intenta más tarde.</p>

  <!-- Botón para volver -->

			!text-black
			hover:bg-accent-7
			hover:!text-white
			!rounded-full
			transition-all
			duration-200
			flex
			items-center
			gap-2
			px-4
			py-2"
    (click)="reload()"
