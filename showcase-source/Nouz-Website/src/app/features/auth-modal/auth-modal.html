<!-- Fondo -->
<div
  class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center"
  (click)="closeModal()"
>
  <!-- Contenedor principal -->
  <div
    class="relative w-full max-w-4xl h-[480px] bg-white rounded-3xl overflow-hidden"
    (click)="$event.stopPropagation()"
  >

  <!-- BOTÓN VOLVER -->
    <button
      class="absolute top-6 left-6 z-30
            w-10 h-10 flex items-center justify-center
            rounded-full transition-colors duration-800"
      [ngClass]="{
        'text-white hover:bg-white/20': !isRegister,
        'text-black hover:bg-black/10': isRegister
      }"
      (click)="closeModal()"
    >
      <!-- Flecha -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </button>


    <!-- PANEL DE COLOR (SIEMPRE ARRIBA) -->
    <div
      class="absolute top-0 h-full w-1/2
             bg-violetaA text-white
             flex items-center justify-center
             transition-all duration-700 ease-in-out
             z-20"
      [ngClass]="{
        'left-0': !isRegister,
        'left-1/2': isRegister
      }"
    >
      <div class="text-center px-10">
        <h2 class="text-4xl font-heavitas mb-4">
          {{ isRegister ? '¡Hola!' : '¡Bienvenido!' }}
        </h2>

        <!-- Mensaje principal -->
        <p class="opacity-90 mb-8">
          {{ isRegister
            ? 'Crea una cuenta y empieza ahora'
            : 'Inicia sesión y continúa tu experiencia'
          }}
        </p>

        <!-- Mensaje secundario (más sutil, cerca del botón) -->
        <p class="mt-20 text-sm opacity-80">
          {{ isRegister
            ? 'Inicia sesión aquí'
            : '¿No tienes una cuenta?'
          }}
        </p>

        <!-- Botón más abajo -->
        <button
          class="mt-5 border border-white rounded-full px-8 py-3 font-semibold
                hover:bg-white hover:text-black transition"
          (click)="toggleMode()"
        >
          {{ isRegister ? 'Inicia sesión' : 'Regístrate' }}
        </button>
      </div>
    </div>

    <!-- FORMULARIO LOGIN -->
    <!-- FORMULARIO LOGIN -->
    <!-- FORMULARIO LOGIN -->
    <div
      class="absolute top-0 left-1/2 h-full w-1/2
            flex items-center justify-center
            transition-opacity duration-500 ease-in-out
            z-10"
      [ngClass]="{
        'opacity-100 pointer-events-auto': !isRegister,
        'opacity-0 pointer-events-none': isRegister
      }"
    >
      <div class="w-full max-w-sm px-8">
        <h2 class="text-3xl font-heavitas text-center mb-6">
          Iniciar sesión
        </h2>

        <form class="flex flex-col gap-4">
          <input
            type="email"
            placeholder="Correo electrónico"
            class="border rounded-lg px-4 py-2
                   focus:ring-2 focus:ring-violetaA outline-none"
          />

          <input
            type="password"
            placeholder="Contraseña"
            class="border rounded-lg px-4 py-2
                   focus:ring-2 focus:ring-violetaA outline-none"
          />

          <button
            type="button"
            class="bg-violetaA text-white rounded-full py-3 mt-4
                  hover:bg-violetaA/90 transition"
            (click)="login()"
          >
            Ingresar
          </button>
        </form>
      </div>
    </div>

    <!-- FORMULARIO REGISTRO -->
    <div
      class="absolute top-0 h-full w-1/2
             flex items-center justify-center
             transition-all duration-700 ease-in-out
             z-10"
      [ngClass]="{
        'left-0 opacity-100 pointer-events-auto': isRegister,
        'left-0 opacity-40 pointer-events-none': !isRegister
      }"
    >
      <div class="w-full max-w-sm px-8">
        <h2 class="text-3xl font-heavitas text-center mb-6">
          Crear cuenta
        </h2>

        <form class="flex flex-col gap-4">
          <input
            type="email"
            placeholder="Correo electrónico"
            class="border rounded-lg px-4 py-2
                   focus:ring-2 focus:ring-violetaA outline-none"
          />

          <input
            type="password"
            placeholder="Contraseña"
            class="border rounded-lg px-4 py-2
                   focus:ring-2 focus:ring-violetaA outline-none"
          />

          <input
            type="password"
            placeholder="Repetir contraseña"
            class="border rounded-lg px-4 py-2
                   focus:ring-2 focus:ring-violetaA outline-none"
          />

          <button
            type="button"
            class="bg-violetaA text-white rounded-full py-3 mt-4
                  hover:bg-violetaA/90 transition"
            (click)="register()"
          >
            Registrarse
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
