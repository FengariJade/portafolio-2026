<section class="relative min-h-screen bg-blanco flex justify-center pt-50 px-6">

  <!-- DEGRADADO SUPERIOR -->
  <div
    class="absolute top-0 left-0 w-full h-35
           bg-linear-to-b
           from-[#1FA2FF]
           to-white
           rounded-b-[3rem]
           z-0">
  </div>

    <!-- BOTÓN VOLVER (FUERA DEL CONTENIDO) -->
    <button
        routerLink="/"
        class="group absolute top-30 left-50
                inline-flex items-center gap-4
                px-6 py-3
                text-lg font-bold
                text-violetaA
                rounded-full
                transition-all duration-200
                z-20"
        >
        <!-- Flecha -->
        <svg
            class="w-8 h-8
                transition-transform duration-300 ease-out
                group-hover:-translate-x-1"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
        >
            <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
            />
        </svg>

        Volver al inicio
        </button>



  <!-- CONTENIDO -->
  <div class="relative w-full max-w-5xl p-10 z-10">


    <h1 class="text-3xl font-heavitas text-black mb-8">
      Mi perfil
    </h1>

    <!-- Avatar -->
    <div class="flex items-center gap-6 mb-10">
      <div
        class="w-24 h-24 rounded-full bg-white
               flex items-center justify-center
               text-violetaA text-3xl font-bold
               shadow-lg shadow-black/10
               border"
      >
        {{ user.name.charAt(0) }}
      </div>

      <button
        class="px-5 py-2 rounded-full
               bg-violetaA text-white
               hover:bg-violetaA/90
               transition"
      >
        Cambiar avatar
      </button>
    </div>

    <!-- Form -->
    <div class="grid md:grid-cols-2 gap-6">

      <div>
        <label class="block text-black/70 text-sm mb-1">
          Nombre
        </label>
        <input
          type="text"
          class="w-full px-4 py-3 rounded-xl
                 bg-white
                 shadow-lg shadow-black/10
                 focus:outline-none
                 border border-violetaA"
        />
      </div>

      <div>
        <label class="block text-black/70 text-sm mb-1">
          Email
        </label>
        <input
          type="email"
          class="w-full px-4 py-3 rounded-xl
                 bg-white
                 shadow-lg shadow-black/10   
                 focus:outline-none
                 border border-violetaA"
        />
      </div>

      <div>
        <label class="block text-black/70 text-sm mb-1">
          Teléfono
        </label>
        <input
          type="tel"
          class="w-full px-4 py-3 rounded-xl
                 bg-white
                 shadow-lg shadow-black/10
                 focus:outline-none
                 border border-violetaA"
        />
      </div>

      <div>
        <label class="block text-black/70 text-sm mb-1">
          Nueva contraseña
        </label>
        <input
          type="password"
          class="w-full px-4 py-3 rounded-xl
                 bg-white
                 shadow-lg shadow-black/10
                 focus:outline-none
                 border border-violetaA"
        />
      </div>

    </div>

    <!-- Guardar -->
    <div class="mt-10 flex justify-end">
      <button
        class="px-8 py-3 rounded-full
               bg-violetaA text-white
               shadow-lg
               hover:bg-violetaA/90
               transition"
      >
        Guardar cambios
      </button>
    </div>

    <img
      src="/images/decoration/cube.png"
      alt=""
      class="absolute right-[-200px] bottom-50 w-19 h-19 z-30 float-slow"
    />

    <img
      src="/images/decoration/circle1.png"
      alt=""
      class="absolute -top-20 -right-60 w-6 h-6 float-medium"
    />

    <img
        src="/images/decoration/star3.png"
        alt=""
        class="absolute top-50 z-40 -left-70 w-15 h-15 float-fast"
    />

  </div>
</section>
