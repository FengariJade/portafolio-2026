<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" (click)="close.emit()">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8" (click)="$event.stopPropagation()">
        <div class="flex flex-col items-center text-center gap-4">
          <div class="w-16 h-16 rounded-2xl bg-red-100 flex items-center justify-center">
            <iconify-icon icon="mdi:trash-can-outline" class="text-red-500" style="font-size:32px"></iconify-icon>
          </div>
          <div>
            <h3 class="text-lg font-bold text-gray-800">Eliminar manifiesto</h3>
            <p class="text-gray-500 text-sm mt-1">¿Seguro que deseas eliminar <span class="font-mono font-semibold text-gray-700">{{ manifestCode }}</span>?</p>
          </div>
          @if (error()) { <p class="text-sm text-red-500 bg-red-50 px-4 py-2 rounded-xl w-full">{{ error() }}</p> }
          <div class="flex gap-3 w-full mt-2">
            <button (click)="close.emit()" class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl">Cancelar</button>
            <button (click)="confirm()" [disabled]="loading()"
              class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-red-500 hover:bg-red-600 disabled:opacity-50 rounded-xl flex items-center justify-center gap-2">
              @if (loading()) { <iconify-icon icon="mdi:loading" class="animate-spin" style="font-size:16px"></iconify-icon> }
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
