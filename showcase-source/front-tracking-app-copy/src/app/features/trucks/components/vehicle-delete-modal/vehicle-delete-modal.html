@if (isOpen()) {
  <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6"
    (click)="close.emit()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8"
      (click)="$event.stopPropagation()">

      <div class="flex flex-col items-center text-center gap-4">
        <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center">
          <iconify-icon icon="mdi:truck-remove" class="text-red-500 text-2xl"></iconify-icon>
        </div>
        <h3 class="text-xl font-bold text-gray-800">¿Eliminar camión?</h3>
        <p class="text-sm text-gray-500">Esta acción no se puede deshacer. El camión será eliminado de la flota.</p>
      </div>

      @if (error()) {
        <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mt-4">
          <span>⚠️</span><span>{{ error() }}</span>
        </div>
      }

      <div class="flex gap-3 mt-6">
        <button (click)="close.emit()"
          class="flex-1 px-6 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all">
          Cancelar
        </button>
        <button (click)="confirm.emit()"
          class="flex-1 px-6 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-semibold transition-all">
          Sí, eliminar
        </button>
      </div>

    </div>
  </div>
}
