<div class="flex flex-wrap items-center gap-3 mb-6">

  <!-- 🔍 Search -->
  <div class="flex items-center gap-2 flex-1 min-w-64 bg-white border border-gray-200 rounded-xl px-4 py-2.5">
    <iconify-icon icon="mdi:magnify" class="text-gray-400 text-xl shrink-0"></iconify-icon>

    <input
      type="text"
      placeholder="Buscar por código, remitente, destino..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="searchChange.emit($event)"
      class="flex-1 text-sm outline-none bg-transparent text-gray-700 placeholder-gray-400"
    />

    @if (searchQuery) {
      <button
        (click)="searchChange.emit('')"
        class="text-gray-400 hover:text-gray-600"
      >
        <iconify-icon icon="mdi:close" class="text-lg"></iconify-icon>
      </button>
    }
  </div>

  <!-- 📦 Status filter -->
  <div class="relative">
    <select
      [(ngModel)]="selectedStatus"
      (ngModelChange)="statusChange.emit($event)"
      class="appearance-none bg-white border border-gray-200 rounded-xl px-4 py-2.5 pr-9 text-sm text-gray-700 outline-none focus:ring-2 focus:ring-violet-500 cursor-pointer"
    >
      <option value="all">Todos los estados</option>
      <option value="CREATED">Creado</option>
      <option value="PICKED_UP">Recogido</option>
      <option value="AT_ORIGIN_WAREHOUSE">Almacén origen</option>
      <option value="IN_TRANSIT">En tránsito</option>
      <option value="AT_DESTINATION_WAREHOUSE">Almacén destino</option>
      <option value="OUT_FOR_DELIVERY">En reparto</option>
      <option value="DELIVERED">Entregado</option>
      <option value="FAILED_ATTEMPT">Intento fallido</option>
      <option value="RETURNED_TO_SENDER">Devuelto</option>
      <option value="EXCEPTION">Incidencia</option>
    </select>

    <iconify-icon
      icon="mdi:chevron-down"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg pointer-events-none"
    ></iconify-icon>
  </div>

  <!-- 🧹 Clear filters -->
  @if (hasActiveFilters) {
    <button
      (click)="clear.emit()"
      class="flex items-center gap-1.5 px-4 py-2.5 text-sm font-medium text-red-500 bg-red-50 hover:bg-red-100 rounded-xl"
    >
      <iconify-icon icon="mdi:filter-off" class="text-lg"></iconify-icon>
      Limpiar
    </button>
  }

  <!-- 🔢 Results counter -->
  <span class="ml-auto text-sm text-gray-400">
    {{ resultsCount }} resultado{{ resultsCount !== 1 ? 's' : '' }}
  </span>

</div>
