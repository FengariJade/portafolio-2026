@if (package()) {
  <div
    class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6"
    (click)="close.emit()"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-md"
      (click)="$event.stopPropagation()"
    >

      <div class="px-8 py-8 flex flex-col items-center text-center gap-4">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center">
          <iconify-icon icon="mdi:trash-can-outline" class="text-red-500 text-3xl"></iconify-icon>
        </div>
        <div>
          <h3 class="text-xl font-bold text-gray-800">¿Eliminar paquete?</h3>
          <p class="text-sm text-gray-500 mt-2">
            Estás a punto de eliminar el paquete
            <span class="font-semibold text-gray-700">{{ package()!.packageCode }}</span>.
            Esta acción no se puede deshacer.
          </p>
        </div>
      </div>

      @if (error()) {
        <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mx-8 mb-4">
          <span>⚠️</span><span>{{ error() }}</span>
        </div>
      }

      <div class="px-8 pb-8 flex gap-3">
        <button
          (click)="close.emit()"
          class="flex-1 py-3 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all"
        >
          Cancelar
        </button>
        <button
          (click)="confirm.emit()"
          class="flex-1 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-semibold transition-all"
        >
          Sí, eliminar
        </button>
      </div>

    </div>
  </div>
}
