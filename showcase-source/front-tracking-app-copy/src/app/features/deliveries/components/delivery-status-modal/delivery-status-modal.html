@if (package()) {
  <div
    class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6"
    (click)="close.emit()"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-md"
      (click)="$event.stopPropagation()"
    >

      <div class="flex items-center justify-between px-8 py-6 border-b border-gray-100">
        <div>
          <h3 class="text-xl font-bold text-gray-800">Cambiar Estado</h3>
          <p class="text-sm font-mono mt-1 text-violet-600">{{ package()!.packageCode }}</p>
        </div>
        <button
          (click)="close.emit()"
          class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 text-xl"
        >✕</button>
      </div>

      <form [formGroup]="statusForm" class="px-8 py-6 flex flex-col gap-5">

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-700">Estado interno</label>
          <select formControlName="internalStatus"
            class="border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-violet-500 bg-gray-50 focus:bg-white transition-all">
            <option value="DRAFT">Draft</option>
            <option value="RECEIVED">Recibido</option>
            <option value="STOWED">Almacenado</option>
            <option value="DISPATCHED">Despachado</option>
            <option value="IN_TRANSIT">En tránsito</option>
            <option value="DELIVERED">Entregado</option>
            <option value="RETURNED">Devuelto</option>
          </select>
          <p class="text-xs text-gray-400">Estado operativo interno del paquete</p>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-gray-700">Estado de tracking</label>
          <select formControlName="trackingStatus"
            class="border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-violet-500 bg-gray-50 focus:bg-white transition-all">
            <option value="CREATED">Creado</option>
            <option value="IN_TRANSIT">En tránsito</option>
            <option value="OUT_FOR_DELIVERY">En camino</option>
            <option value="COMPLETED">Completado</option>
            <option value="EXCEPTION">Excepción</option>
          </select>
          <p class="text-xs text-gray-400">Estado visible para el cliente final</p>
        </div>

        @if (error()) {
          <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg">
            <span>⚠️</span><span>{{ error() }}</span>
          </div>
        }

      </form>

      <div class="px-8 pb-8 flex gap-3">
        <button
          (click)="close.emit()"
          class="flex-1 py-3 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all"
        >
          Cancelar
        </button>
        <button
          (click)="onSave()"
          [disabled]="loading()"
          class="flex-1 py-3 rounded-xl bg-violet-600 hover:bg-violet-700 disabled:opacity-50 text-white text-sm font-semibold transition-all"
        >
          {{ loading() ? 'Guardando...' : 'Guardar estado' }}
        </button>
      </div>

    </div>
  </div>
}
