@if (isOpen()) {
  <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6"
    (click)="close.emit()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center"
      (click)="$event.stopPropagation()">

      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-5">
        <iconify-icon icon="mdi:account-remove" class="text-red-500 text-3xl"></iconify-icon>
      </div>

      <h3 class="text-xl font-bold text-gray-800 mb-2">¿Desactivar usuario?</h3>
      <p class="text-sm text-gray-500 mb-8">El usuario perderá acceso al sistema. Puedes reactivarlo desde la tabla.</p>

      @if (error()) {
        <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mb-4">
          <span>⚠️</span><span>{{ error() }}</span>
        </div>
      }

      <div class="flex gap-3">
        <button (click)="close.emit()"
          class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all">
          Cancelar
        </button>
        <button (click)="confirm()" [disabled]="loading()"
          class="flex-1 py-2.5 rounded-xl text-white text-sm font-semibold transition-all disabled:opacity-50"
          [ngClass]="loading() ? 'bg-red-400' : 'bg-red-500 hover:bg-red-600'">
          {{ loading() ? 'Desactivando...' : 'Sí, desactivar' }}
        </button>
      </div>

    </div>
  </div>
}
