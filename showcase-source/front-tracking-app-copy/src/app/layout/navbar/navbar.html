<header class="w-full h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-50">

  <!-- Izquierda: botón mobile + título -->
  <div class="flex items-center gap-4">

      <!-- Logo -->
    <div class="flex items-center px-4 py-5">

        <!-- Logo -->
        <div class="flex items-center gap-3 pl-8 pr-17">
            <img src="/icon/logo-violeta.svg" class="h-8 w-auto" alt="Flotex logo" />
        </div>

        <!-- Línea divisora -->
        <div class="h-6 w-px bg-gray-300"></div>

        <!-- Título -->
        <h1 class="ml-6 text-gray-800 font-semibold text-lg">
            {{ pageTitle() }}
        </h1>

    </div>


  </div>

  <!-- Derecha: notificaciones + usuario -->
  <div class="flex items-center gap-3">

    <!-- Usuario -->
    <div class="relative">
      <button
        (click)="showUserMenu = !showUserMenu"
        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
        <div class="w-8 h-8 rounded-full bg-violet-500 flex items-center justify-center text-white text-xs font-bold">
          U
        </div>
        <span class="hidden sm:block text-sm text-gray-700 font-medium">Usuario</span>
        <span class="text-gray-400 text-xs">▾</span>
      </button>

      <!-- Dropdown -->
      @if (showUserMenu) {
        <div class="absolute right-0 top-12 w-48 bg-white border border-gray-200 rounded-xl shadow-lg py-2 z-50">
          <div class="px-4 py-2 border-b border-gray-100">
            <p class="text-sm font-medium text-gray-800">Usuario</p>
            <p class="text-xs text-gray-400">admin@flotex.com</p>
          </div>
          <button
            (click)="logout()"
            class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-500 hover:bg-red-50 transition-colors">

            <iconify-icon
                icon="majesticons:logout-half-circle-line"
                class="text-2xl">
            </iconify-icon>

            <span>Cerrar sesión</span>

            </button>

        </div>
      }
    </div>

  </div>

</header>
