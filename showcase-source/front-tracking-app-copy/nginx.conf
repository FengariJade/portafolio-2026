# Configuracion Nginx interna del contenedor frontend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion gzip para mejorar tiempos de carga
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cacheo de assets estaticos (JS, CSS, imagenes) con hash en el nombre
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta que no sea un archivo, redirige a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
