stages:
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  DOCKER_TLS_CERTDIR: ""

# ---------------------------------------------------------------------------
# FASE BUILD: Construccion y publicacion de la imagen Docker en el registry
# ---------------------------------------------------------------------------
build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
  only:
    - main

# ---------------------------------------------------------------------------
# FASE DEPLOY: Despliegue a produccion via SSH
# ---------------------------------------------------------------------------
deploy_to_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY"
    - ssh $SERVER_USER@$SERVER_IP "cd /opt/flotexs && docker pull $LATEST_TAG"
    - ssh $SERVER_USER@$SERVER_IP "cd /opt/flotexs && docker compose -f docker-compose.prod.yml up -d flotexs-web --no-deps --remove-orphans"
    - ssh $SERVER_USER@$SERVER_IP "docker image prune -f"
  only:
    - main
